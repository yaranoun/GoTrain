[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gotrain"
version = "0.1.0"
description = "An agent that trains Earth-observation models on GEO-Bench tasks on its own, served over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geobench",
    "h5py",
    "huggingface_hub",
    "strands-agents==0.3.0",
    "mcp>=1.23,<2",
    "strands-agents-tools",
    "torch",
    "torchvision",
    "timm",
    "torchgeo",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "boto3",
]

[project.scripts]
gotrain-mcp = "gotrain.mcp_server:main"

[tool.setuptools.packages.find]
include = ["gotrain*"]

[tool.setuptools.package-data]
gotrain = ["prompts/*.md", "baselines.json"]
