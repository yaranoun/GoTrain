# CPU test suite on GitHub Actions: every push (except the GPU chain's run/** results branches) and every pull request.
# Synthetic data only: the gates never touch a test split, a GPU or the network beyond pip.
name: tests

on:
  push:
    branches-ignore: ["run/**"]   # the GPU chain's results branch commits data, not code
  pull_request:
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash               # -eo pipefail: a failing command in a pipe fails the step
    env:
      CUDA_VISIBLE_DEVICES: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # verify's git checks read history and the freeze tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU torch first, then the package)
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: gotrain-mcp --check
        run: gotrain-mcp --version && GOTRAIN_MCP_WORKSPACE=$RUNNER_TEMP/mcp/workspace gotrain-mcp --check
      - name: Tests
        run: python -m pytest -q tests/
